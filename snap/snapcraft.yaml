name: all-dev-eegateway
base: core24
version: '1.0.2'
summary: Bluetooth-LE gateway for open BLE IoT networks.
description: |
  ALL Dev EE Gateway turns an Ubuntu Core device into a Bluetooth ground
  station for open BLE IoT networks (Hubble Network today). It scans with
  the host Bluetooth radio and forwards packets over HTTPS to
  encryptedenergy.com.

  Two daemons share persistent state under $SNAP_COMMON on Ubuntu Core with
  FDE: a worker that scans BLE and ingests packets upstream, and a web
  dashboard for first-time setup and live status. Configure via the UI or
  snap set.

icon: snap/gui/icon.svg
title: EE Gateway
license: GPL-3.0-only
contact: support@all.is.one
source-code: https://github.com/Encrypted-Energy/gateway
website: https://all.is.one/
issues: https://github.com/Encrypted-Energy/gateway/issues

grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:

plugs:
  bluetooth-client:
    interface: bluez
  gps-serial:
    interface: serial-port
  # Optional HTTPS front-end via all-dev-caddy.
  #   snap connect all-dev-eegateway:caddy-proxy all-dev-caddy:proxy-config
  caddy-proxy:
    interface: content
    content: caddy-proxy-config
    target: $SNAP_COMMON/caddy

hooks:
  configure:
    plugs:
      - network
      - caddy-proxy

apps:
  worker:
    command: bin/start-worker.sh
    daemon: simple
    daemon-scope: system
    restart-condition: always
    restart-delay: 10s
    plugs:
      - network
      - bluetooth-client
      - gps-serial
      - hardware-observe
    environment: &py-env
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PATH: $SNAP/usr/sbin:$SNAP/usr/bin:$SNAP/sbin:$SNAP/bin:$PATH
      LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib/x86_64-linux-gnu
      PYTHONPATH: $SNAP/local/lib/python3.12/dist-packages:$SNAP/lib/python3.12/site-packages:$SNAP/usr/lib/python3/dist-packages:$SNAP/usr/lib/python3.12/dist-packages
      SSL_CERT_FILE: $SNAP/etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: $SNAP/etc/ssl/certs
      REQUESTS_CA_BUNDLE: $SNAP/etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: $SNAP/etc/ssl/certs/ca-certificates.crt
      EE_GATEWAY_VERSION: "0.10.6"

  ui:
    command: bin/start-ui.sh
    daemon: simple
    daemon-scope: system
    restart-condition: always
    restart-delay: 5s
    plugs:
      - network
      - network-bind
      - caddy-proxy
    environment: *py-env

lint:
  ignore:
    - library

parts:
  # Bundle CPython + OpenSSL by extracting debs into the part install tree.
  # snapcraft stage-packages often filters interpreter/stdlib files against the
  # base snap, which leaves $SNAP without python3/_ssl and breaks HTTPS
  # (urllib: "unknown url type: https").
  python-runtime:
    plugin: nil
    build-packages:
      - ca-certificates
      - apt
    override-build: |
      set -eux
      DEST="${CRAFT_PART_INSTALL}"
      mkdir -p "${DEST}"
      WORK="$(mktemp -d)"
      cd "${WORK}"
      apt-get download \
        python3.12-minimal \
        python3.12 \
        libpython3.12-minimal \
        libpython3.12-stdlib \
        libpython3.12t64 \
        libexpat1 \
        zlib1g \
        libreadline8t64 \
        libncursesw6 \
        libsqlite3-0 \
        libffi8 \
        libssl3t64 \
        openssl \
        ca-certificates \
        media-types \
        netbase \
        readline-common \
        libtinfo6 \
        libcrypt1 \
        libbz2-1.0 \
        liblzma5 \
        libdb5.3t64
      for deb in ./*.deb; do
        dpkg-deb -x "${deb}" "${DEST}"
      done
      if [ -e "${DEST}/usr/bin/python3.12" ] && [ ! -e "${DEST}/usr/bin/python3" ]; then
        ln -sfn python3.12 "${DEST}/usr/bin/python3"
      fi
      # ca-certificates.crt is generated by package postinst, not shipped in the
      # .deb — copy the build host's bundle so runtime SSL verify works.
      mkdir -p "${DEST}/etc/ssl/certs"
      if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
        cp -a /etc/ssl/certs/ca-certificates.crt "${DEST}/etc/ssl/certs/ca-certificates.crt"
      fi
      # Must exist before prime — this is what enables https:// in urllib.
      find "${DEST}" \( -name '_ssl*.so' -o -name '_ssl*.so.*' \) | tee /dev/stderr | grep -q .
      test -x "${DEST}/usr/bin/python3.12"
      rm -rf "${WORK}"
    override-prime: |
      set -eux
      craftctl default

      # Snap Store rejects absolute symlinks. Debian's libpython3.12-minimal
      # ships:
      #   usr/lib/python3.12/sitecustomize.py -> /etc/python3.12/sitecustomize.py
      # Rewrite any absolute symlink under prime to an in-snap relative target
      # when it resolves inside this payload.
      _symlink_list="$(mktemp)"
      find . -type l > "${_symlink_list}"
      while IFS= read -r _link; do
        [ -n "${_link}" ] || continue
        _target="$(readlink "${_link}")"
        case "${_target}" in
          /*)
            _normalized=".${_target}"
            if [ -e "${_normalized}" ]; then
              _rel="$(realpath --relative-to="$(dirname "${_link}")" "${_normalized}")"
              ln -sfn "${_rel}" "${_link}"
            fi
            ;;
        esac
      done < "${_symlink_list}"
      rm -f "${_symlink_list}"

      # If prime filtering dropped _ssl, copy it back from the part install.
      if ! find . \( -name '_ssl*.so' -o -name '_ssl*.so.*' \) | grep -q .; then
        echo "re-copying _ssl from part install" >&2
        mkdir -p usr/lib/python3.12/lib-dynload
        cp -a "${CRAFT_PART_INSTALL}/usr/lib/python3.12/lib-dynload/_ssl"* \
          usr/lib/python3.12/lib-dynload/
      fi

      if [ -e usr/bin/python3.12 ] && [ ! -e usr/bin/python3 ]; then
        ln -sfn python3.12 usr/bin/python3
      fi
      test -x usr/bin/python3.12
      test -e usr/bin/python3

      SSL_SO="$(find . \( -name '_ssl*.so' -o -name '_ssl*.so.*' \) | head -n1)"
      test -n "${SSL_SO}"
      echo "found ${SSL_SO}"

      # Final gate: no absolute symlinks can remain.
      if find . -type l -exec sh -c 't="$(readlink "$1")"; case "$t" in /*) exit 0;; *) exit 1;; esac' sh {} \; | grep -q .; then
        echo "absolute symlinks still present in prime payload" >&2
        find . -type l -exec sh -c 't="$(readlink "$1")"; case "$t" in /*) echo "$1 -> $t";; esac' sh {} \; >&2
        exit 1
      fi

      # Ensure libssl is present for _ssl.so to dlopen.
      find . \( -name 'libssl.so*' -o -name 'libcrypto.so*' \) | tee /dev/stderr | grep -q libssl

      if [ -f etc/ssl/certs/ca-certificates.crt ]; then
        echo "ca-certificates.crt present"
      elif [ -f usr/lib/ssl/cert.pem ]; then
        mkdir -p etc/ssl/certs
        ln -sfn ../../usr/lib/ssl/cert.pem etc/ssl/certs/ca-certificates.crt
      else
        # ca-certificates package layout on Ubuntu
        if [ -d usr/share/ca-certificates ] || [ -d etc/ssl/certs ]; then
          mkdir -p etc/ssl/certs
          # Prefer the concatenated bundle if update-ca-certificates produced it
          # in the extracted tree; otherwise point at openssl's cert.pem.
          if [ -f usr/lib/ssl/certs/ca-certificates.crt ]; then
            ln -sfn ../../usr/lib/ssl/certs/ca-certificates.crt etc/ssl/certs/ca-certificates.crt
          elif [ -f usr/lib/ssl/cert.pem ]; then
            ln -sfn ../../usr/lib/ssl/cert.pem etc/ssl/certs/ca-certificates.crt
          else
            echo "WARNING: no concatenated CA bundle; HTTPS verify may fail" >&2
          fi
        else
          echo "ca-certificates missing from prime" >&2
          exit 1
        fi
      fi

      export LD_LIBRARY_PATH="${CRAFT_PRIME}/usr/lib/x86_64-linux-gnu:${CRAFT_PRIME}/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
      export PYTHONHOME="${CRAFT_PRIME}/usr"
      usr/bin/python3.12 -c 'import ssl, urllib.request; print(ssl.OPENSSL_VERSION)'

  gateway-python:
    plugin: nil
    after: [python-runtime]
    source: https://github.com/Encrypted-Energy/gateway.git
    source-type: git
    source-tag: v0.10.6
    source-depth: 1
    build-packages:
      - gcc
      - g++
      - libffi-dev
      - python3-dev
      - python3-pip
      - python3-setuptools
      - python3-wheel
      - ca-certificates
    override-build: |
      set -eux

      # Upstream package-data lists only static/*.css; include fonts and assets.
      sed -i 's/"static\/\*\.css"/"static\/*"/' ui/pyproject.toml

      # Allow snap to bind UI to localhost when caddy-proxy is enabled.
      sed -i \
        's/create_app().run(host="0.0.0.0", port=port, debug=False)/create_app().run(host=os.environ.get("EE_UI_HOST", "0.0.0.0"), port=port, debug=False)/' \
        ui/src/ee_gateway_ui/app.py

      # Strip Umbrel-oriented wording from the Flask docstring (cosmetic).
      sed -i \
        's/sitting behind Umbrel'\''s app proxy/on the local network/' \
        ui/src/ee_gateway_ui/app.py || true

      pip install --prefix="${CRAFT_PART_INSTALL}" --ignore-installed ./worker ./ui

      # pip may land under local/.../dist-packages or lib/.../site-packages.
      WORKER_PKG="$(find "${CRAFT_PART_INSTALL}" -type d -name ee_gateway_worker | head -n1)"
      UI_PKG="$(find "${CRAFT_PART_INSTALL}" -type d -name ee_gateway_ui | head -n1)"
      test -n "${WORKER_PKG}"
      test -n "${UI_PKG}"

  gpsd-support:
    plugin: nil
    stage-packages:
      - gpsd
      - gpsd-clients

  jq-tools:
    plugin: nil
    stage-packages:
      - jq
      - libjq1
      - libonig5

  snap-scripts:
    plugin: nil
    source: .
    after: [gateway-python, gpsd-support, jq-tools, python-runtime]
    override-build: |
      set -eu
      for script in \
        "${CRAFT_PROJECT_DIR}/bin/start-worker.sh" \
        "${CRAFT_PROJECT_DIR}/bin/start-ui.sh" \
        "${CRAFT_PROJECT_DIR}/bin/hooks-lib.sh" \
        "${CRAFT_PROJECT_DIR}/snap/hooks/install" \
        "${CRAFT_PROJECT_DIR}/snap/hooks/configure"
      do
        sed -i 's/\r$//' "$script"
        chmod 755 "$script"
      done
      install -D -m 755 "${CRAFT_PROJECT_DIR}/bin/start-worker.sh" \
        "${CRAFT_PART_INSTALL}/bin/start-worker.sh"
      install -D -m 755 "${CRAFT_PROJECT_DIR}/bin/start-ui.sh" \
        "${CRAFT_PART_INSTALL}/bin/start-ui.sh"
      install -D -m 755 "${CRAFT_PROJECT_DIR}/bin/hooks-lib.sh" \
        "${CRAFT_PART_INSTALL}/bin/hooks-lib.sh"
    stage:
      - bin/start-worker.sh
      - bin/start-ui.sh
      - bin/hooks-lib.sh
    prime:
      - bin/start-worker.sh
      - bin/start-ui.sh
      - bin/hooks-lib.sh
